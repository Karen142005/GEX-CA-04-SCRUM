<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUPPORT 360° | Registrarse</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav>
    <a href="/"><strong>SUPPORT 360°</strong></a>
  </nav>

  <main>
    <h1 id="titulo">Registrarse como <span class="rol-nombre"></span></h1>
    <form id="form-auth">
      <input type="hidden" name="rolId">
      <label>Nombre de usuario
        <input type="text" name="nombre" required>
      </label>
      <label>Correo Electronico
        <input type="email" name="email" required>
      </label>
      <label>Clave
        <input type="password" name="clave" required>
      </label>
      <button type="submit" class="btn">Crear cuenta</button>
    </form>
    <p id="msg-auth"></p>
    <p><button type="button" class="btn" onclick="history.back()">Volver</button></p>
  </main>

  <script src="/js/main.js"></script>
  <script>
    initAuthPage();
  </script>
</body>
</html>
