<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAR-Z | Iniciar sesión</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav>
    <a href="/"><strong>MAR-Z</strong></a>
    <a href="/">Inicio</a>
  </nav>

  <main>
    <h1 id="titulo">Iniciar sesión como <span class="rol-nombre"></span></h1>
    <form id="form-auth">
      <input type="hidden" name="rolId">
      <label>Usuario
        <input type="text" name="usuario" required>
      </label>
      <label>Clave
        <input type="password" name="clave" required>
      </label>
      <button type="submit" class="btn">Entrar</button>
    </form>
    <p id="msg-auth"></p>
    <p><button type="button" class="btn" onclick="history.back()">Volver</button></p>
  </main>

  <footer>
    <p>MAR-Z &copy; 2026 - MVC basico Node.js</p>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    initAuthPage();
  </script>
</body>
</html>
