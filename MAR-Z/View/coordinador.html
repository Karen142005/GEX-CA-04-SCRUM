<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coordinador</title>
</head>
<body>
    <h1>Coordinador</h1>
    <h2>Bienvenido <span id="nombre">...</span></h2>
    <button id="btn-salir">Cerrar Sesión</button>
    <div>
        <h1>Solicitudes</h1>
        <label>Ordenar por
            <select id="orden">
                <option value="prioridad">Prioridad</option>
                <option value="estado">Estado</option>
                <option value="fecha">Fecha</option>
            </select>
        </label>
        <ul id="lista-todas"></ul>
        <p id="msg-coord"></p>
    </div>

    <div class="panel">
        <h2>Buscar solicitudes</h2>
        <div id="filtros-buscar" class="filtros" data-texto="si"></div>
        <ul id="resultados-buscar"></ul>
    </div>
    <div class="panel">
        <h2>Indicadores</h2>
        <div id="filtros-ind" class="filtros"></div>
        <div id="indicadores"></div>
    </div>
    <div class="panel">
        <h2>Exportar reporte (CSV)</h2>
        <p>Incluye número, categoría, estado, prioridad, fechas y código del agente. No incluye credenciales ni texto libre.</p>
        <div id="filtros-csv" class="filtros"></div>
        <button type="button" id="btn-exportar">Descargar CSV</button>
    </div>
    <script src="/js/main.js"></script>
    <script>
        initCoordinador();
    </script>
</body>
</html>
